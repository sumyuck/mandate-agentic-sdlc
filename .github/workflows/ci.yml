name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CI: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: build / test / style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Warnings are errors (Directory.Build.props), so this step is a real quality gate.
      - name: Build
        run: dotnet build --no-restore --nologo

      # Includes the architecture tests that enforce docs/adr/0001-0003.
      - name: Test
        run: dotnet test --no-build --nologo --collect:"XPlat Code Coverage"

      - name: Verify code style
        run: dotnet format --verify-no-changes

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/TestResults/**/coverage.cobertura.xml"
          if-no-files-found: ignore
